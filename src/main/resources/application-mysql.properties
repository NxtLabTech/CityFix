spring.datasource.url=jdbc:mysql://localhost:3306/cityfix?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable the H2 in-memory console when running with the MySQL profile,
# since it is only useful for the default H2 setup.
spring.h2.console.enabled=false